[build]
  command = "cd scraper && npm install && cd .. && npm install"
  publish = "src"
  functions = "scraper/functions"

[functions]
  node_bundler = "zisi"
  external_node_modules = ["tls-impersonate"]
  included_files = ["scraper/functions/node_modules/**", "scraper/lib/**"]

[[plugins]]
  package = "./scraper/plugins/process-queue"
